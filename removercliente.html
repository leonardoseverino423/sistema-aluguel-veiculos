<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Remover Cliente</title>
    <link rel="stylesheet" href="aluguel.css">
</head>
<body>
    <header>
        <h1>Remover Cliente</h1>
    </header>

    <main>
<p>Selecione o cliente que deseja excluir.</p>
<form data-confirmar="Tem certeza que deseja excluir este cliente? Essa ação não pode ser desfeita.">
<label for="cliente">Cliente:</label>
<select id="cliente" name="cliente" required>
<option value="">Selecione um cliente</option>
<option value="1">Cliente 1 - Nome: João, CPF: 123.456.789-00</option>
<option value="2">Cliente 2 - Nome: Maria, CPF: 987.654.321-00</option>
</select>

<button type="submit">Excluir</button>
</form>
</main>

    <footer>
        <p class="destaque"><a href="index.html">Voltar ao menu principal</a></p>
    </footer>
    <script src="validacao.js"></script>
    <script src="confirmar.js"></script>
</body>
</html>
