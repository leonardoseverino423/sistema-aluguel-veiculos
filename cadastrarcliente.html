<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cadastrar Cliente</title>
<link rel="stylesheet" href="aluguel.css">
</head>
<body>
<header>
<h1>Cadastrar Cliente</h1>
</header>

<main>
<p>Preencha o formulário abaixo para cadastrar um novo cliente.</p>
<form>
<label for="nome">Nome:</label>
<input type="text" id="nome" name="nome" required>

<label for="cpf">CPF:</label>
<input 
type="text" 
id="cpf" 
name="cpf" 
pattern="[0-9]{3}\.?[0-9]{3}\.?[0-9]{3}-?[0-9]{2}" 
title="Digite o CPF com 11 números, com ou sem pontos e traço (ex: 12345678900 ou 123.456.789-00)"
placeholder="000.000.000-00 ou 00000000000"
required>

<label for="cnh">CNH:</label>
<input type="text" id="cnh" name="cnh" required>

<label for="telefone">Telefone:</label>
<input type="tel" id="telefone" name="telefone" required>

<label for="endereco">Endereço:</label>
<input type="text" id="endereco" name="endereco" required>

<button type="submit">Cadastrar</button>
</form>
</main>

<footer>
<p class="destaque"><a href="index.html">Voltar ao menu principal</a></p>
</footer>
</body>
</html>
