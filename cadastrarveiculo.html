<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cadastrar Veículo</title>
<link rel="stylesheet" href="aluguel.css">
</head>
<body>

<header class="site-header">
  <div class="site-header__brand">
    <h1 class="site-header__title">Cadastrar Veículo</h1>
  </div>
</header>

<main class="main-content">
  <p>Preencha o formulário abaixo para cadastrar um novo veículo.</p>

  <!--
    <form> agrupa os campos que o usuário vai preencher.
    Cada campo fica dentro de uma <div class="campo"> (rótulo em cima, campo embaixo).
    O for="marca" do <label> liga o texto ao campo que tem id="marca".
    O type diz ao HTML que tipo de campo criar (texto, número, e-mail...).
  -->
  <form action="/cadastrar-veiculo" method="post">

    <div class="campo">
      <label for="marca">Marca:</label>
      <input type="text" id="marca" name="marca" required>
    </div>

    <div class="campo">
      <label for="modelo">Modelo:</label>
      <input type="text" id="modelo" name="modelo" required>
    </div>

    <div class="campo">
      <label for="placa">Placa:</label>
      <input type="text" id="placa" name="placa" required>
    </div>

    <!-- min="0.01": a diária precisa ser maior que zero (o Python também exige) -->
    <div class="campo">
      <label for="preco_dia">Preço por dia (R$):</label>
      <input type="number" id="preco_dia" name="preco_dia" step="0.01" min="0.01" inputmode="decimal" required>
    </div>

    <div class="campo">
      <label for="ano">Ano:</label>
      <input type="number" id="ano" name="ano" min="1950" required>
    </div>

    <div class="campo">
      <label for="cor">Cor:</label>
      <input type="text" id="cor" name="cor" required>
    </div>

    <div class="campo">
      <label for="renavam">Renavam:</label>
      <input type="text" id="renavam" name="renavam" required>
    </div>

    <div class="campo">
      <label for="quilometragem">Quilometragem:</label>
      <input type="number" id="quilometragem" name="quilometragem" min="0" step="1" inputmode="numeric" required>
    </div>

    <button type="submit">Cadastrar</button>
  </form>
</main>

<footer class="site-footer">
  <p class="site-footer__notice"><a href="index.html">Voltar ao menu principal</a></p>
</footer>

<script src="validacao.js"></script>
</body>
</html>
