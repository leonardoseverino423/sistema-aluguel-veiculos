<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Cliente</title>
    <link rel="stylesheet" href="aluguel.css">
</head>
<body>
    <header>
        <h1>Editar Cliente</h1>
    </header>

    <main>
    <p>Selecione o Cliente que deseja editar e preencha os campos com as novas informações.</p>
 <form>
    <label for="cliente">Cliente:</label>
    <select id="cliente" name="cliente" required>
    <option value="">Selecione um cliente</option>
               
    </select>
<label for="nome">Nome:</label>
<input type="text" id="nome" name="nome" required>

<label for="cpf">CPF:</label>
<input type="text" id="cpf" name="cpf" required>

<label for="cnh">CNH:</label>
<input type="text" id="cnh" name="cnh" required>

<label for="telefone">Telefone:</label>
<input type="tel" id="telefone" name="telefone" required>

<label for="endereco">Endereço:</label>
<input type="text" id="endereco" name="endereco" required>
      
<button type="submit">Salvar Alterações</button>
 </form>
    </main>

    <footer>
        <p class="destaque"><a href="index.html">Voltar ao menu principal</a></p>
    </footer>
    <script src="validacao.js"></script>
</body>
</html>
